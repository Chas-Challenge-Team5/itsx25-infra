version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "pip"
    directory: "/tests"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "terraform"
    directories:
      - "/"
      - "/bootstrap"
      - "/access"
      - "/iap-access"
      - "/monitoring"
      - "/pki-backup"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
