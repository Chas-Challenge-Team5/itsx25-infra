name: Deploy Infrastructure

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-deploy
  cancel-in-progress: false

env:
  # Plans stay in the private state bucket, never in public artifacts.
  PLAN_BUCKET: team5-tfstate-f7036a24

jobs:
  plan:
    name: Terraform Plan
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      id-token: write
    outputs:
      plan_uri: ${{ steps.save.outputs.plan_uri }}
      plan_sha256: ${{ steps.save.outputs.plan_sha256 }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify approval environment is configured
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/check_apply_environment.py

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.CICD_SERVICE_ACCOUNT }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.1"
          terraform_wrapper: false

      - name: Terraform Init and Validate
        run: |
          terraform init -input=false -lockfile=readonly
          terraform validate

      - name: Terraform Plan
        # Plan output may contain secrets; reviewers inspect the private GCS object.
        run: |
          if ! terraform plan -input=false -no-color -out=deploy.tfplan > "$RUNNER_TEMP/terraform-plan.log" 2>&1; then
            echo "::error::Terraform plan failed. Inspect with an authorized local plan; raw plan output is not published."
            exit 1
          fi

      - name: Save plan for review
        id: save
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          plan_uri="gs://${PLAN_BUCKET}/terraform/deploy-plans/${RUN_ID}/${RUN_ATTEMPT}/deploy.tfplan"
          plan_sha256=$(sha256sum deploy.tfplan | cut -d ' ' -f 1)
          gcloud storage cp deploy.tfplan "$plan_uri" --if-generation-match=0
          echo "plan_uri=$plan_uri" >> "$GITHUB_OUTPUT"
          echo "plan_sha256=$plan_sha256" >> "$GITHUB_OUTPUT"
          {
            echo '### Plan ready for review'
            echo "Commit: $COMMIT_SHA"
            echo "Private plan: $plan_uri"
            echo "SHA-256: $plan_sha256"
            echo 'Download with authorized GCP access, verify SHA-256, and inspect using Terraform 1.16.1 before approving terraform-apply.'
            echo 'If rejected or expired, remove the saved GCS object. A new plan requires a new review.'
          } >> "$GITHUB_STEP_SUMMARY"

  apply:
    name: Terraform Apply (approval required)
    needs: plan
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    # Configure reviewers, prevent self-review, main-only access and no admin bypass before merge.
    environment: terraform-apply
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.CICD_SERVICE_ACCOUNT }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.1"
          terraform_wrapper: false

      - name: Download and verify approved plan
        env:
          PLAN_URI: ${{ needs.plan.outputs.plan_uri }}
          PLAN_SHA256: ${{ needs.plan.outputs.plan_sha256 }}
        run: |
          gcloud storage cp "$PLAN_URI" deploy.tfplan
          printf '%s  deploy.tfplan\n' "$PLAN_SHA256" | sha256sum --check --strict

      - name: Terraform Init
        run: terraform init -input=false -lockfile=readonly

      - name: Apply approved plan
        run: terraform apply -input=false deploy.tfplan

      - name: Remove applied plan
        env:
          PLAN_URI: ${{ needs.plan.outputs.plan_uri }}
        run: gcloud storage rm "$PLAN_URI"
