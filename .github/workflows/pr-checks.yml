name: Terraform PR Checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  terraform-checks:
    name: Format & Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.1"
          terraform_wrapper: false

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Test Headscale configuration and user setup (isolated)
        run: sudo python3 headscale/check.py

      - name: Test Tailscale update policy (isolated, no package upgrades)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-apt unattended-upgrades
          /usr/bin/python3 -m unittest discover -s tests/updates -v

      # Every PR runs without cloud credentials or backend access.
      - name: Terraform Init (root)
        run: terraform init -input=false -backend=false -lockfile=readonly

      - name: Terraform Validate (root)
        run: terraform validate

      - name: Test firewall rules (mocked, no GCP access)
        run: terraform test

      - name: Test host firewall and NAT in isolated networks
        timeout-minutes: 3
        run: sudo env "PATH=$PATH" python3 tests/network_firewall.py

      # Bootstrap is applied separately; PR checks never access its state.
      - name: Terraform Init (bootstrap)
        run: terraform init -input=false -backend=false -lockfile=readonly
        working-directory: bootstrap

      - name: Terraform Validate and Test (bootstrap, mocked)
        run: |
          terraform validate
          terraform test
        working-directory: bootstrap

      # The sshd hardening test (#86) runs sshd -T as a normal user.
      - name: Install sshd for the hardening test
        run: |
          if ! command -v sshd >/dev/null && [ ! -x /usr/sbin/sshd ]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends openssh-server
          fi

      - name: Test IAM conditions, apply protection and host hardening (no GCP access)
        run: |
          python -m pip install -r tests/requirements.txt
          python -m unittest discover -s tests -v

      # IAP-modulen förvaltas separat och ska inte appliceras av deploy-jobbet.
      - name: Terraform Init (iap-access, no backend)
        run: terraform init -input=false -backend=false -lockfile=readonly
        working-directory: iap-access

      - name: Check Secure Boot migration script syntax
        run: bash -n scripts/prepare-secure-boot.sh

      - name: Terraform Validate and Test (iap-access, mocked)
        run: |
          terraform validate
          terraform test
        working-directory: iap-access

      # Access IAM is managed separately and is verified before OS Login is enabled.
      - name: Terraform Init (access, no backend)
        run: terraform init -input=false -backend=false -lockfile=readonly
        working-directory: access

      - name: Terraform Validate and Test (access, mocked)
        run: |
          terraform validate
          terraform test
        working-directory: access

      # Pinned hash from the v0.55.1 checksums.txt, so a replaced release asset fails here.
      - name: Install TFLint
        env:
          TFLINT_VERSION: "0.55.1"
          TFLINT_SHA256: "53379f38bc1e86c18885bfc85dc5fe2cd1f59729ae9a2afa16905189c1d67aa9"
        working-directory: ${{ runner.temp }}
        run: |
          curl -fsSLO "https://github.com/terraform-linters/tflint/releases/download/v${TFLINT_VERSION}/tflint_linux_amd64.zip"
          echo "${TFLINT_SHA256}  tflint_linux_amd64.zip" | sha256sum -c -
          unzip -q tflint_linux_amd64.zip tflint
          sudo install -m 0755 tflint /usr/local/bin/tflint

      - name: TFLint (all roots)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tflint --init --config "$PWD/.tflint.hcl"
          tflint --recursive --config "$PWD/.tflint.hcl"

      - name: Checkov (all roots)
        run: |
          python -m pip install checkov==3.2.334
          checkov -d . --framework terraform --compact
