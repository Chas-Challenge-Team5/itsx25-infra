name: Terraform PR Checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  terraform-checks:
    name: Format & Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.CICD_SERVICE_ACCOUNT }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.7"

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      # Rotmodulen: nätet som pipelinen deployar.
      - name: Terraform Init (root)
        run: terraform init

      - name: Terraform Validate (root)
        run: terraform validate

      - name: Terraform Plan (root)
        run: terraform plan -input=false -no-color

      # Bootstrap: körs för hand, men valideras och planeras här så en trasig
      # bootstrap/main.tf inte glider förbi grön CI som förr (#9). validate är
      # syntaxgrinden, fmt kontrollerar bara formatering och stoppar inte HCL
      # som inte går att parsa.
      - name: Terraform Init (bootstrap)
        run: terraform init
        working-directory: bootstrap

      - name: Terraform Validate (bootstrap)
        run: terraform validate
        working-directory: bootstrap

      - name: Terraform Plan (bootstrap)
        run: terraform plan -input=false -no-color
        working-directory: bootstrap
